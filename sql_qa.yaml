- question: |
    Quelles ressources portent le plus d’heures réelles et quelle part est billable ou on-site ?
    Quelles ressources allouent la majorité de leurs heures à du facturable ou à de l’on-site ?
  sql: |
    SELECT
      r.ONB AS resource_onb,
      SUM(wp.TOTAL_LOAD) AS actual_hours,
      SUM(CASE WHEN wp.OPX2__TC_AA_B_BILLABLE = true  THEN wp.TOTAL_LOAD ELSE 0 END) AS billable_hours,
      SUM(CASE WHEN wp.OPX2__TC_AA_B_ON_SITE  = true THEN wp.TOTAL_LOAD ELSE 0 END) AS on_site_hours
    FROM WORK_PERFORMED wp
    JOIN OPX2_RESOURCE r ON r.ONB = wp.OPX2_RESOURCE
    GROUP BY r.ONB
    ORDER BY actual_hours DESC;

- question: |
    Par CBS, quelles sont les heures réelles et les heures planifiées agrégées ?
    Quels CBS concentrent le plus de charge consommée et/ou budgétée ?
  sql: |
    WITH a AS (
      SELECT CBS, SUM(TOTAL_LOAD) AS ah
      FROM WORK_PERFORMED GROUP BY CBS
    ),
    p AS (
      SELECT CBS, SUM(TOTAL_LOAD) AS ph
      FROM TASK_ALLOC GROUP BY CBS
    )
    SELECT
      COALESCE(a.CBS, p.CBS) AS cbs_onb,
      COALESCE(a.ah,0) AS actual_hours,
      COALESCE(p.ph,0) AS planned_hours
    FROM a
    FULL OUTER JOIN p ON p.CBS = a.CBS
    ORDER BY cbs_onb;

- question: |
    Comment se répartissent les allocations planifiées par DURATION_MODE et FIXED_RATE ?
    Quels réglages (mode de durée, taux fixe ou non) portent le plus d’allocations et d’heures planifiées ?
  sql: |
    SELECT
      ta.DURATION_MODE,
      ta.FIXED_RATE,
      COUNT(*)            AS nb_alloc,
      SUM(ta.TOTAL_LOAD)  AS planned_hours,
      AVG(ta.RATE)        AS avg_rate
    FROM TASK_ALLOC ta
    GROUP BY ta.DURATION_MODE, ta.FIXED_RATE
    ORDER BY nb_alloc DESC;

- question: |
    Quel est le coût planifié par projet (budget/prévision) et combien de lignes le composent ?
    Quels projets ont les budgets planifiés les plus élevés ?
  sql: |
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      SUM(e.qty)        AS planned_cost,
      COUNT(*)          AS lines
    FROM EXPENDITURE e
    JOIN ORDO_PROJECT p ON p.ONB = e.DATASET
    GROUP BY p.ONB, p.NAME
    ORDER BY planned_cost DESC;

