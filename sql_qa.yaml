- question: |
    Quel est le coût planifié (budget/prévision) du projet 007 ?
    Pour le projet 007, combien de lignes budgétaires sont comptabilisées et quel est le total ?
  sql: |
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      SUM(e.qty)        AS planned_cost,
      COUNT(*)          AS lines
    FROM EXPENDITURE e
    JOIN ORDO_PROJECT p ON p.ONB = e.DATASET
    WHERE p."name" = '007'
    GROUP BY p.ONB, p.NAME
