- question: |
    Par projet, quels sont le coût réel (AC), le coût planifié (PLN) et l’EAC (AC + PLN) ?
    Quels projets ont l’EAC le plus élevé et comment se décomposent AC et PLN ?
  sql: |
    WITH ac AS (
      SELECT ie.DATASET, SUM(ie.qty) AS actual_cost
      FROM INCURRED_EXPENDITURE ie
      GROUP BY ie.DATASET
    ),
    pln AS (
      SELECT e.DATASET, SUM(e.qty) AS planned_cost
      FROM EXPENDITURE e
      GROUP BY e.DATASET
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      COALESCE(a.actual_cost,0) AS actual_cost,
      COALESCE(pl.planned_cost,0) AS planned_cost,
      COALESCE(a.actual_cost,0) + COALESCE(pl.planned_cost,0) AS eac_cost
    FROM ORDO_PROJECT p
    JOIN ac  a  ON a.DATASET  = p.ONB
    JOIN pln pl ON pl.DATASET = p.ONB
    WHERE a.DATASET IS NOT NULL OR pl.DATASET IS NOT NULL
    ORDER BY eac_cost DESC;

- question: |
    Quels sont, par CBS, les coûts réels, planifiés et l’EAC (AC + PLN) ?
    Quels CBS portent les coûts totaux (EAC) les plus importants ?
  sql: |
    WITH ac AS (
      SELECT CBS, SUM(qty) AS actual_cost
      FROM INCURRED_EXPENDITURE
      GROUP BY CBS
    ),
    pln AS (
      SELECT CBS, SUM(qty) AS planned_cost
      FROM EXPENDITURE
      GROUP BY CBS
    )
    SELECT
      COALESCE(ac.CBS, pln.CBS) AS cbs_onb,
      COALESCE(ac.actual_cost,0) AS actual_cost,
      COALESCE(pln.planned_cost,0) AS planned_cost,
      COALESCE(ac.actual_cost,0) + COALESCE(pln.planned_cost,0) AS eac_cost
    FROM ac
    FULL OUTER JOIN pln ON pln.CBS = ac.CBS
    ORDER BY eac_cost DESC;

- question: |
    Comment se répartissent les coûts planifiés par type et par unité (devise) ?
    Quels couples Type × Unité concentrent le plus de budget planifié et combien de lignes comptent-ils ?
  sql: |
    SELECT
      e.TYPE,
      e.UNIT,                         -- devise / unité
      SUM(e.qty) AS planned_cost,
      COUNT(*)   AS lines
    FROM EXPENDITURE e
    GROUP BY e.TYPE, e.UNIT
    ORDER BY planned_cost DESC;

- question: |
    Comment consolider, par projet, les heures réelles/planifiées et les coûts réels/planifiés (avec EAC heures et EAC coût) ?
    Quels projets présentent quels niveaux d’heures et de coûts actuels et prévus, ainsi que leurs EAC correspondants ?
  sql: |
    WITH ah AS ( -- Actual Hours
      SELECT DATASET, SUM(TOTAL_LOAD) AS actual_hours
      FROM WORK_PERFORMED GROUP BY DATASET
    ),
    ph AS ( -- Planned Hours
      SELECT DATASET, SUM(TOTAL_LOAD) AS planned_hours
      FROM TASK_ALLOC GROUP BY DATASET
    ),
    ac AS ( -- Actual Cost (si DATASET présent sur incurred)
      SELECT DATASET, SUM(qty) AS actual_cost
      FROM INCURRED_EXPENDITURE GROUP BY DATASET
    ),
    pc AS ( -- Planned Cost
      SELECT DATASET, SUM(qty) AS planned_cost
      FROM EXPENDITURE GROUP BY DATASET
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      COALESCE(ah.actual_hours,0) AS actual_hours,
      COALESCE(ph.planned_hours,0) AS planned_hours,
      COALESCE(ah.actual_hours,0) + COALESCE(ph.planned_hours,0) AS eac_hours,
      COALESCE(ac.actual_cost,0)  AS actual_cost,
      COALESCE(pc.planned_cost,0) AS planned_cost,
      COALESCE(ac.actual_cost,0) + COALESCE(pc.planned_cost,0) AS eac_cost
    FROM ORDO_PROJECT p
    LEFT JOIN ah ON ah.DATASET = p.ONB
    LEFT JOIN ph ON ph.DATASET = p.ONB
    LEFT JOIN ac ON ac.DATASET = p.ONB
    LEFT JOIN pc ON pc.DATASET = p.ONB
    WHERE ah.DATASET IS NOT NULL OR ph.DATASET IS NOT NULL
       OR ac.DATASET IS NOT NULL OR pc.DATASET IS NOT NULL
    ORDER BY p.ONB;

###
- question: |
    Comment comparer, par projet, les heures réelles et planifiées ainsi que les coûts réels et budgétés (avec EAC heures et EAC coût) ?
    Quels projets présentent quels niveaux d’heures/costs actuels et prévus, et quels EAC correspondants ?
  sql: |
    WITH ah AS ( -- Actual Hours
      SELECT DATASET, SUM(TOTAL_LOAD) AS actual_hours
      FROM WORK_PERFORMED GROUP BY DATASET
    ),
    ph AS ( -- Planned Hours
      SELECT DATASET, SUM(TOTAL_LOAD) AS planned_hours
      FROM TASK_ALLOC GROUP BY DATASET
    ),
    ac AS ( -- Actual Cost
      SELECT DATASET, SUM(qty) AS actual_cost
      FROM INCURRED_EXPENDITURE GROUP BY DATASET
    ),
    pc AS ( -- Planned Cost
      SELECT DATASET, SUM(qty) AS planned_cost
      FROM EXPENDITURE GROUP BY DATASET
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      COALESCE(ah.actual_hours,0) AS actual_hours,
      COALESCE(ph.planned_hours,0) AS planned_hours,
      COALESCE(ah.actual_hours,0) + COALESCE(ph.planned_hours,0) AS eac_hours,
      COALESCE(ac.actual_cost,0)  AS actual_cost,
      COALESCE(pc.planned_cost,0) AS planned_cost,
      COALESCE(ac.actual_cost,0) + COALESCE(pc.planned_cost,0) AS eac_cost
    FROM ORDO_PROJECT p
    LEFT JOIN ah ON ah.DATASET = p.ONB
    LEFT JOIN ph ON ph.DATASET = p.ONB
    LEFT JOIN ac ON ac.DATASET = p.ONB
    LEFT JOIN pc ON pc.DATASET = p.ONB
    WHERE ah.DATASET IS NOT NULL OR ph.DATASET IS NOT NULL
       OR ac.DATASET IS NOT NULL OR pc.DATASET IS NOT NULL
    ORDER BY p.ONB;

- question: |
    Quel est le coût horaire budgété (€ / h) par projet et CBS lorsque les heures et coûts planifiés sont corrélés ?
    Pour chaque couple projet×CBS, quel ratio planned_cost / planned_hours obtient-on et quels sont les plus élevés ?
  sql: |
    WITH ph AS ( -- Planned hours par projet × CBS
      SELECT DATASET, CBS, SUM(TOTAL_LOAD) AS ph
      FROM TASK_ALLOC GROUP BY DATASET, CBS
    ),
    pc AS ( -- Planned cost par projet × CBS
      SELECT DATASET, CBS, SUM(qty) AS pc
      FROM EXPENDITURE GROUP BY DATASET, CBS
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      ph.CBS AS cbs_onb,
      ph.ph  AS planned_hours,
      pc.pc  AS planned_cost,
      CASE WHEN ph.ph > 0 THEN pc.pc / ph.ph ELSE NULL END AS planned_cost_per_hour
    FROM ph
    JOIN pc ON pc.DATASET = ph.DATASET AND pc.CBS = ph.CBS
    JOIN ORDO_PROJECT p ON p.ONB = ph.DATASET
    ORDER BY planned_cost_per_hour DESC NULLS LAST;

- question: |
    Quel est l’impact attendu d’un glissement de durée de +10 % selon FIXED_RATE sur les heures et le taux moyen ?
    Pour chaque ressource et projet, comment varient les heures et le rate si la durée augmente de 10 % ?
  sql: |
    SELECT
      ta.DATASET,
      ta.OPX2_RESOURCE,
      ta.DURATION_MODE,
      ta.FIXED_RATE,
      SUM(ta.TOTAL_LOAD) AS planned_hours,
      AVG(ta.RATE)       AS avg_rate,
      CASE WHEN ta.FIXED_RATE = true
           THEN SUM(ta.TOTAL_LOAD) * 1.10
           ELSE SUM(ta.TOTAL_LOAD)
      END AS hours_if_plus10pct_duration,
      CASE WHEN ta.FIXED_RATE = false AND AVG(ta.RATE) IS NOT NULL AND AVG(ta.RATE) <> 0
           THEN AVG(ta.RATE) / 1.10
           ELSE AVG(ta.RATE)
      END AS rate_if_plus10pct_duration
    FROM TASK_ALLOC ta
    GROUP BY ta.DATASET, ta.OPX2_RESOURCE, ta.DURATION_MODE, ta.FIXED_RATE
    ORDER BY ta.DATASET, ta.OPX2_RESOURCE;

- question: |
    Quelles ressources génériques portent des heures réelles et en quel volume ?
    Quelles sont les ressources marquées “génériques” avec le plus d’heures déclarées (tri décroissant) ?
  sql: |
    SELECT
      r.ONB AS resource_onb,
      r."name",
      SUM(wp.TOTAL_LOAD) AS actual_hours
    FROM WORK_PERFORMED wp
    JOIN OPX2_RESOURCE r ON r.ONB = wp.OPX2_RESOURCE
    WHERE r.OPX2__INF_AA_B_GENERIC_RES = true
    GROUP BY r.ONB
    ORDER BY actual_hours DESC;

- question: |
    Quels plans sont incohérents car FIXED_RATE=1 mais sans dates fixes (FIXED_START/END manquantes) ?
    Quelles lignes de TASK_ALLOC doivent être corrigées pour cohérence des contraintes ?
  sql: |
    SELECT *
    FROM TASK_ALLOC
    WHERE FIXED_RATE = true
      AND (FIXED_START IS NULL OR FIXED_END IS NULL);

- question: |
    Pour chaque projet×CBS, quelles sont les heures (réelles/planifiées) et les coûts (réels/planifiés) agrégés ?
    Quels couples projet×CBS concentrent les volumes les plus élevés d’heures et/ou de coûts ?
  sql: |
    WITH ah AS (
      SELECT DATASET, CBS, SUM(TOTAL_LOAD) AS actual_hours
      FROM WORK_PERFORMED GROUP BY DATASET, CBS
    ),
    ph AS (
      SELECT DATASET, CBS, SUM(TOTAL_LOAD) AS planned_hours
      FROM TASK_ALLOC GROUP BY DATASET, CBS
    ),
    ac AS (
      SELECT DATASET, CBS, SUM(qty) AS actual_cost
      FROM INCURRED_EXPENDITURE GROUP BY DATASET, CBS
    ),
    pc AS (
      SELECT DATASET, CBS, SUM(qty) AS planned_cost
      FROM EXPENDITURE GROUP BY DATASET, CBS
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      k.CBS  AS cbs_onb,
      COALESCE(ah.actual_hours,0) AS actual_hours,
      COALESCE(ph.planned_hours,0) AS planned_hours,
      COALESCE(ac.actual_cost,0)  AS actual_cost,
      COALESCE(pc.planned_cost,0) AS planned_cost
    FROM (
      SELECT DISTINCT COALESCE(ah.DATASET, ph.DATASET, ac.DATASET, pc.DATASET) AS DATASET,
                      COALESCE(ah.CBS, ph.CBS, ac.CBS, pc.CBS) AS CBS
      FROM ah FULL OUTER JOIN ph ON ph.DATASET = ah.DATASET AND ph.CBS = ah.CBS
      FULL OUTER JOIN ac ON ac.DATASET = COALESCE(ah.DATASET, ph.DATASET)
                        AND ac.CBS    = COALESCE(ah.CBS, ph.CBS)
      FULL OUTER JOIN pc ON pc.DATASET = COALESCE(ah.DATASET, ph.DATASET, ac.DATASET)
                        AND pc.CBS    = COALESCE(ah.CBS, ph.CBS, ac.CBS)
    ) k
    JOIN ORDO_PROJECT p ON p.ONB = k.DATASET
    LEFT JOIN ah ON ah.DATASET = k.DATASET AND ah.CBS = k.CBS
    LEFT JOIN ph ON ph.DATASET = k.DATASET AND ph.CBS = k.CBS
    LEFT JOIN ac ON ac.DATASET = k.DATASET AND ac.CBS = k.CBS
    LEFT JOIN pc ON pc.DATASET = k.DATASET AND pc.CBS = k.CBS
    ORDER BY p.ONB, k.CBS;

- question: |
    Pour le projet 001, puis-je obtenir un audit rapide ordonné par placement WBS puis par date de début cible ?
    Quels enregistrements du projet 001 apparaissent et dans quel ordre WBS / chronologique (début/fin) ?
  sql: |
    SELECT ws.*
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE op."name" = '001'
    ORDER BY ws.placement NULLS LAST, ws.target_start NULLS LAST, ws.target_finish NULLS LAST;

###
- question: |
    Quelles sont, par projet, les bornes temporelles de réalisation (premier début effectif et dernier fin effective) ainsi que la fin prévue ?
    Pour chaque projet, quelle est l’étendue (span) du planning et combien d’éléments sont comptés ?
  sql: |
    SELECT op."name" AS project_code,
           MIN(ws.effective_start)  AS first_target_start,
           MAX(ws.effective_finish) AS last_target_finish,
           MAX(ws.target_finish) AS supposed_finish,
           COUNT(*)              AS nb_rows
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    GROUP BY op."name"
    ORDER BY op."name";

- question: |
    Quel est l’avancement “physique” moyen (0–100) par projet ?
    Quels projets affichent les plus forts niveaux d’avancement moyen et combien d’items sont pris en compte ?
  sql: |
    SELECT op."name" AS project_code,
           ROUND(AVG(ws.physical_furtherance)::numeric,1) AS avg_phys_progress,
           COUNT(*) AS nb_items
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.physical_furtherance IS NOT NULL
    GROUP BY op."name"
    ORDER BY avg_phys_progress DESC NULLS LAST;

- question: |
    Quelle est la répartition des task_type par projet (volumes par type) ?
    Pour chaque projet, combien d’éléments de chaque type (jalon, sommaire, feuille, etc.) sont présents ?
  sql: |
    SELECT op."name" AS project_code, ws.task_type, COUNT(*) AS nb
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    GROUP BY op."name", ws.task_type
    ORDER BY op."name", ws.task_type;

- question: |
    Quelle est la matrice Produit (BS1) × Client (BS0) : nombre d’activités et somme d’ETC ?
    Quels couples produit–client concentrent le plus d’ETC et d’activités ?
  sql: |
    SELECT COALESCE(ws.opx2_1bs) AS product_line,
           COALESCE(ws.opx2_0bs) AS customer,
           COUNT(*) AS nb_activities,
           SUM(ws.etc) AS etc_sum
    FROM work_structure ws
    GROUP BY product_line, customer
    ORDER BY etc_sum DESC NULLS LAST, nb_activities DESC;

- question: |
    Quels éléments de tous les projets ont une date de fin cible dans les 90 prochains jours ?
    Pour ces éléments, quelles sont les dates de fin prévues triées chronologiquement par projet et activité ?
  sql: |
    SELECT op."name" AS project_code, ws.onb, ws.name, ws."name" , ws.target_finish  
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.target_finish >= now() 
      AND ws.target_finish <  now()  + make_interval(days => 90)
    ORDER BY ws.target_finish;

- question: |
    Quels éléments sont en retard (date de fin planifiée échue) et non terminés ?
    Pour chaque projet, quelles activités sont en retard aujourd’hui car encore sans date de fin effective ?
  sql: |
    SELECT op."name" AS project_code, ws.onb, ws.name, ws.target_finish, ws.effective_finish
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.target_finish < now() 
      AND ws.effective_finish IS NULL;

- question: |
    Quels sont les écarts (en jours) entre la date de fin réelle et la date de fin planifiée ?
    Quelles activités présentent les plus grands écarts positifs ou négatifs de délai ?
  sql: |
    SELECT op."name" AS project_code, ws.onb, ws.name,
           ws.target_finish, ws.effective_finish,
           EXTRACT(DAY FROM (ws.effective_finish - ws.target_finish)) AS delta_days
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.effective_finish IS NOT NULL
    ORDER BY delta_days DESC NULLS LAST;

- question: |
    Quels éléments ont une contrainte de début (imposed_start) postérieure au début planifié ?
    Pour quels projets observe-t-on un imposed_start supérieur à target_start ?
  sql: |
    SELECT op."name" AS project_code, ws.onb, ws.name, ws.target_start , ws.imposed_start
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.imposed_start IS NOT NULL
      AND ws.target_start IS NOT NULL
      AND ws.imposed_start > ws.target_start;

- question: |
    Quels éléments ont une fin imposée (imposed_end) antérieure à la fin planifiée ?
    Pour quels projets la contrainte de fin est-elle plus tôt que la cible (risque de deadline irréaliste) ?
  sql: |
    SELECT op."name" AS project_code, ws.onb, ws.name, ws.target_finish , ws.imposed_end
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.imposed_end IS NOT NULL
      AND ws.target_finish  IS NOT NULL
      AND ws.imposed_end < ws.target_finish;

- question: |
    Quels éléments n’ont pas de dates cibles (target_start ou target_finish manquantes) ?
    Pour ces éléments sans cibles, quels sont les types et priorités par projet ?
  sql: |
    SELECT op."name" AS project_code, ws.task_type, ws.priority
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.target_start IS NULL OR ws.target_finish IS NULL;

###
- question: |
    Quelle est la priorité moyenne des tâches par projet ?
    Quels projets ont la priorité moyenne la plus élevée et combien de tâches sont comptées ?
  sql: |
    SELECT op."name" AS project_code,
           ROUND(AVG(ws.priority)::numeric,1) AS avg_priority,
           COUNT(*) AS nb
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.priority IS NOT NULL
    GROUP BY op."name"
    ORDER BY avg_priority DESC NULLS LAST;

- question: |
    Quel est le taux de clôture (tc_closed) par projet ?
    Pour chaque projet, combien de tâches sont clôturées vs ouvertes/indéterminées ?
  sql: |
    SELECT op."name" AS project_code,
           COUNT(*) FILTER (WHERE ws.tc_closed IS TRUE)  AS closed,
           COUNT(*) FILTER (WHERE ws.tc_closed IS NOT TRUE) AS open_or_unknown,
           ROUND(100.0 * COUNT(*) FILTER (WHERE ws.tc_closed IS TRUE) / NULLIF(COUNT(*),0),1) AS pct_closed
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    GROUP BY op."name"
    ORDER BY pct_closed DESC NULLS LAST;

- question: |
    Quels projets contiennent des éléments sans valeur de sync_version ?
    Combien de lignes manquent de sync_version par projet (tri décroissant) ?
  sql: |
    SELECT op."name" AS project_code, COUNT(*) AS nb_missing_sync
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.sync_version IS NULL
    GROUP BY op."name"
    ORDER BY nb_missing_sync DESC;

- question: |
    Quels éléments sont planifiés hors de leur fenêtre budgétaire (sbudget_start/finish) ?
    Pour chaque élément, quelles sont les dates cibles comparées aux bornes budgétaires ?
  sql: |
    SELECT op."name" AS project_code, ws.target_start, ws.target_finish, ws.sbudget_start, ws.sbudget_finish
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE ws.sbudget_start IS NOT NULL AND ws.sbudget_finish IS NOT NULL
      AND (ws.target_start  < ws.sbudget_start OR ws.target_finish > ws.sbudget_finish)
    ORDER BY op."name", ws.target_start NULLS LAST;

- question: |
    Dans le projet 001, quelle est la distribution des priorités ?
    Quelles priorités (les plus hautes ou basses) sont les plus fréquentes dans le projet 001 ?
  sql: |
    SELECT ws.priority, COUNT(*) AS nb
    FROM work_structure ws
    JOIN ordo_project op ON op.onb = ws.dataset
    WHERE op."name" = '001'
    GROUP BY ws.priority
    ORDER BY ws.priority DESC NULLS LAST;

- question: |
    Pour le projet 001, quels sont AC, PLN, EAC, la variance de coût et le CPI ?
    Quelle est l’estimation à achèvement (EAC) et le CPI du projet 001 à partir d’AC et PLN ?
  sql: |
    WITH ac AS (  -- Actual cost sur tout l’historique
      SELECT SUM(ie.qty) AS actual_cost
      FROM INCURRED_EXPENDITURE ie
      JOIN ORDO_PROJECT p ON p.ONB = ie.DATASET
      WHERE p.NAME = '001'
    ),
    pl AS (       -- Planned cost (budget/prévision)
      SELECT SUM(e.qty) AS planned_cost
      FROM EXPENDITURE e
      JOIN ORDO_PROJECT p ON p.ONB = e.DATASET
      WHERE p.NAME = '001'
    )
    SELECT
      COALESCE(ac.actual_cost, 0)                           AS actual_cost,
      COALESCE(pl.planned_cost, 0)                          AS planned_cost,
      COALESCE(ac.actual_cost, 0) + COALESCE(pl.planned_cost, 0) AS eac_cost,
      COALESCE(ac.actual_cost, 0) - COALESCE(pl.planned_cost, 0) AS cost_variance,
      CASE WHEN COALESCE(pl.planned_cost, 0) = 0 THEN NULL
           ELSE COALESCE(ac.actual_cost, 0) / pl.planned_cost
      END AS cpi
    FROM ac
    CROSS JOIN pl;

###
- question: |
    Pour le projet 001, combien d’heures réelles chaque ressource a-t-elle déclarées ?
    Quelles ressources ont le plus consommé d’heures sur le projet 001 ?
  sql: |
    SELECT p.NAME AS project_name,
           wp.OPX2_RESOURCE AS resource_id,
           SUM(wp.TOTAL_LOAD) AS actual_hours
    FROM ORDO_PROJECT p
    JOIN WORK_PERFORMED wp ON wp.DATASET = p.ONB
    WHERE p.NAME = '001'
    GROUP BY p.NAME, wp.OPX2_RESOURCE
    ORDER BY actual_hours DESC;

- question: |
    Sur le projet 001, quelle est la répartition des heures réelles entre facturable et non facturable ?
    Combien d’heures facturables vs non facturables ont été saisies pour le projet 001 ?
  sql: |
    SELECT CASE WHEN wp.OPX2__TC_AA_B_BILLABLE = True THEN 'BILLABLE' ELSE 'NON_BILLABLE' END AS bill_flag,
           SUM(wp.TOTAL_LOAD) AS hours
    FROM ORDO_PROJECT p
    JOIN WORK_PERFORMED wp ON wp.DATASET = p.ONB
    WHERE p.NAME = '001'
    GROUP BY CASE WHEN wp.OPX2__TC_AA_B_BILLABLE = True THEN 'BILLABLE' ELSE 'NON_BILLABLE' END;

- question: |
    Sur les six derniers mois, quel est le total mensuel des heures planifiées du projet 001 ?
    Combien d’heures planifiées par mois (de M-5 à M) pour le projet 001 ?
  sql: |
    WITH months AS (
      SELECT
        (date_trunc('month', now()) - MAKE_INTERVAL(months => g))::date AS m_start,
        ((date_trunc('month', now()) - MAKE_INTERVAL(months => g)) + MAKE_INTERVAL(months => 1)
           - MAKE_INTERVAL(days => 1))::date AS m_end
      FROM generate_series(0, 5) AS g
    )
    SELECT
      m.m_start AS month_start,
      m.m_end   AS month_end,
      COALESCE(
        SUM(
          CASE
            WHEN ta.FIXED_START IS NOT NULL AND ta.FIXED_END IS NOT NULL THEN
              ta.TOTAL_LOAD
              * GREATEST(
                  0,
                  (LEAST(ta.FIXED_END::date, m.m_end::date) - GREATEST(ta.FIXED_START::date, m.m_start::date) + 1)::int
                )::numeric
                / NULLIF((ta.FIXED_END::date - ta.FIXED_START::date + 1)::int, 0)
            ELSE 0
          END
        ), 0
      ) AS planned_hours
    FROM months m
    JOIN ORDO_PROJECT p ON p.NAME = '001'
    JOIN TASK_ALLOC ta  ON ta.DATASET = p.ONB
    GROUP BY m.m_start, m.m_end
    ORDER BY month_start;

- question: |
    Quelles tâches du projet 001 ont une date de fin planifiée dépassée mais ne sont pas clôturées ?
    Combien de tâches en retard non clôturées par type et par priorité dans le projet 001 ?
  sql: |
    SELECT
      ws.task_type,
      ws.priority,
      COUNT(*) AS tasks_late_not_closed
    FROM work_structure ws
    JOIN ORDO_PROJECT p ON p.ONB = ws.DATASET
    WHERE p.NAME = '001'
      AND COALESCE(ws.target_finish, ws.sbudget_finish, ws.real_fixed_end) < now()::date
      AND COALESCE(ws.tc_closed, false) = false
    GROUP BY ws.task_type, ws.priority
    ORDER BY tasks_late_not_closed DESC;

- question: |
    Quels sont les 10 projets qui totalisent le plus d’heures réelles ?
    Dans le portefeuille, quels projets ont le plus consommé d’heures (top 10) ?
  sql: |
    SELECT p.NAME AS project_name,
           SUM(wp.TOTAL_LOAD) AS actual_hours
    FROM ORDO_PROJECT p
    JOIN WORK_PERFORMED wp ON wp.DATASET = p.ONB
    GROUP BY p.NAME
    ORDER BY actual_hours DESC
    LIMIT 10;

- question: |
    Pour le projet 001, quelle est l’exposition totale aux délais liée aux risques ?
    Quel est l’impact cumulé sur les délais des risques du projet 001 ?
  sql: |
    SELECT p.NAME AS project_name,
           SUM(r.MC_AA_D_DELAY_IMPACT) AS total_delay_impact
    FROM ORDO_PROJECT p
    JOIN OPX2__WF_PT_RISKS r ON r.DATASET = p.ONB
    WHERE p.NAME = '001'
    GROUP BY p.NAME;
