- question: "Lister tous les projets avec leur nom et ID (numéro interne)"
  sql: |
    SELECT onb, name
    FROM ordo_project;

- question: "Chercher un projet par son nom contenant '038'"
  sql: |
    SELECT onb, name, real_start, real_finish
    FROM ordo_project
    WHERE name ILIKE '%038%';

- question: "Avoir les risques associés aux projets"
  sql: |
    SELECT owpr.opx2_comment, op2.name
    FROM opx2__wf_pt_risks owpr
    INNER JOIN ordo_project op2 ON op2.onb = owpr.dataset
    ORDER BY op2.name;

- question: "Projets récemment modifiés (avec la date de mise à jour)"
  sql: |
    SELECT onb, name, update_date
    FROM ordo_project
    WHERE update_date IS NOT NULL
    ORDER BY update_date DESC
    LIMIT 20;

- question: "Nombre de projets par utilisateur créateur"
  sql: |
    SELECT owner, COUNT(*) AS nb_projets
    FROM ordo_project
    GROUP BY owner
    ORDER BY nb_projets DESC;

- question: "Projets avec leur description"
  sql: |
    SELECT name, opx2_comment AS description
    FROM ordo_project
    WHERE opx2_comment IS NOT NULL;

- question: "Projets en cours à l’instant présent"
  sql: |
    SELECT name, real_start, real_finish
    FROM ordo_project
    WHERE real_start <= NOW()
      AND (real_finish IS NULL OR real_finish >= NOW());

- question: "Durée des projets (en jours) quand les dates sont renseignées"
  sql: |
    SELECT onb, name, (real_finish - real_start) AS duree_jours
    FROM ordo_project
    WHERE real_start IS NOT NULL
      AND real_finish IS NOT NULL;

- question: "Projets dont le nom ou la description contient 'plan'"
  sql: |
    SELECT onb, name, opx2_comment
    FROM ordo_project
    WHERE name ILIKE '%plan%'
       OR opx2_comment ILIKE '%plan%';

- question: "Nombre de projets par année de début"
  sql: |
    SELECT EXTRACT(YEAR FROM real_start) AS annee, COUNT(*) AS nb_projets
    FROM ordo_project
    WHERE real_start IS NOT NULL
    GROUP BY annee
    ORDER BY annee DESC;

- question: "Statut des projets (En cours / Terminé / À venir)"
  sql: |
    SELECT name,
           CASE
             WHEN real_finish IS NOT NULL AND real_finish < NOW() THEN 'Terminé'
             WHEN real_start IS NOT NULL  AND real_start > NOW() THEN 'À venir'
             ELSE 'En cours'
           END AS statut
    FROM ordo_project;

- question: "Descriptions en doublon (avec le nombre d’occurrences)"
  sql: |
    SELECT opx2_comment, COUNT(*) AS occurrences
    FROM ordo_project
    GROUP BY opx2_comment
    HAVING COUNT(*) > 1
    ORDER BY occurrences DESC, opx2_comment;
- question: |
    Heures réelles par projet
    But : Total des heures réellement saisies sur chaque projet.
    Explication : Regroupe les lignes d’imputation (WORK_PERFORMED) par projet (via DATASET). Tu obtiens le total d’heures consommées par projet.
  sql: |
    SELECT
      p.ONB   AS project_onb,
      p.NAME  AS project_name,
      SUM(wp.TOTAL_LOAD) AS actual_hours
      -- , SUM(wp.TOTAL_LOAD / NULLIF(x.RATE_ACTUAL,0)) AS actual_hours_normalized  -- option : si tu as un taux "réel"
    FROM WORK_PERFORMED wp
    JOIN ORDO_PROJECT p ON p.ONB = wp.DATASET
    GROUP BY p.ONB, p.NAME
    ORDER BY actual_hours DESC;

- question: |
    Heures planifiées par projet
    But : Volume planifié agrégé, pour quantifier la charge budgétée en heures.
    Explication : Agrège TASK_ALLOC par projet. RATE moyen et QTY sont fournis pour qualifier l’intensité et/ou la granularité.
  sql: |
    SELECT
      p.ONB   AS project_onb,
      p.NAME  AS project_name,
      SUM(ta.TOTAL_LOAD) AS planned_hours,
      AVG(ta.RATE)       AS avg_planned_rate,
      SUM(ta.QTY)        AS planned_qty -- utile si QTY a un sens chez toi
    FROM TASK_ALLOC ta
    JOIN ORDO_PROJECT p ON p.ONB = ta.DATASET
    GROUP BY p.ONB, p.NAME
    ORDER BY planned_hours DESC;
###
- question: |
    Comment consolider, par projet et par ressource, les heures réelles et planifiées (même si l’une des deux est absente) ?
    Pour chaque couple projet×ressource, quelles sont les heures consommées, les heures prévues et le taux moyen planifié ?
  sql: |
    WITH act AS (
      SELECT DATASET, OPX2_RESOURCE, SUM(TOTAL_LOAD) AS actual_hours
      FROM WORK_PERFORMED
      GROUP BY DATASET, OPX2_RESOURCE
    ),
    pln AS (
      SELECT DATASET, OPX2_RESOURCE, SUM(TOTAL_LOAD) AS planned_hours, AVG(RATE) AS avg_rate
      FROM TASK_ALLOC
      GROUP BY DATASET, OPX2_RESOURCE
    ),
    u AS (
      -- UNION pour simuler un FULL OUTER JOIN
      SELECT DATASET, OPX2_RESOURCE FROM act
      UNION
      SELECT DATASET, OPX2_RESOURCE FROM pln
    )
    SELECT
      p.ONB  AS project_onb,
      p.NAME AS project_name,
      r.ONB  AS resource_onb,
      COALESCE(a.actual_hours,0) AS actual_hours,
      COALESCE(pl.planned_hours,0) AS planned_hours,
      COALESCE(pl.avg_rate,NULL)   AS planned_avg_rate
    FROM u
    LEFT JOIN ORDO_PROJECT  p ON p.ONB = u.DATASET
    LEFT JOIN OPX2_RESOURCE r ON r.ONB = u.OPX2_RESOURCE
    LEFT JOIN act a  ON a.DATASET = u.DATASET AND a.OPX2_RESOURCE = u.OPX2_RESOURCE
    LEFT JOIN pln pl ON pl.DATASET = u.DATASET AND pl.OPX2_RESOURCE = u.OPX2_RESOURCE
    ORDER BY p.ONB, r.ONB;

- question: |
    Par projet, quelle est l’estimation à terminaison en heures (EAC = Actual + Planned) et le « reste à faire » (ETC) ?
    Quels projets ont les EAC heures les plus élevés et comment se répartissent heures consommées vs planifiées ?
  sql: |
    WITH act AS (
      SELECT DATASET, SUM(TOTAL_LOAD) AS actual_hours
      FROM WORK_PERFORMED
      GROUP BY DATASET
    ),
    pln AS (
      SELECT DATASET, SUM(TOTAL_LOAD) AS planned_hours
      FROM TASK_ALLOC
      GROUP BY DATASET
    )
    SELECT
      p.ONB   AS project_onb,
      p.NAME  AS project_name,
      COALESCE(a.actual_hours,0) AS actual_hours,
      COALESCE(pl.planned_hours,0) AS planned_hours,
      COALESCE(a.actual_hours,0) + COALESCE(pl.planned_hours,0) AS eac_hours, -- EAC heures
      COALESCE(pl.planned_hours,0) AS etc_hours -- « reste à faire » en heures = planned
    FROM ORDO_PROJECT p
    LEFT JOIN act a  ON a.DATASET = p.ONB
    LEFT JOIN pln pl ON pl.DATASET = p.ONB
    WHERE a.DATASET IS NOT NULL OR pl.DATASET IS NOT NULL
    ORDER BY eac_hours DESC;

- question: |
    Pour chaque projet, quel est l’écart d’heures (Actual − Planned) et le pourcentage de progression basé heures ?
    Quels projets apparaissent les plus avancés selon la proportion d’heures consommées sur EAC heures ?
  sql: |
    WITH a AS (
      SELECT DATASET, SUM(TOTAL_LOAD) AS ah FROM WORK_PERFORMED GROUP BY DATASET
    ),
    p AS (
      SELECT DATASET, SUM(TOTAL_LOAD) AS ph FROM TASK_ALLOC GROUP BY DATASET
    )
    SELECT
      pr.ONB   AS project_onb,
      pr.NAME  AS project_name,
      COALESCE(a.ah,0) AS actual_hours,
      COALESCE(p.ph,0) AS planned_hours,
      COALESCE(a.ah,0) - COALESCE(p.ph,0) AS variance_hours,
      CASE
        WHEN COALESCE(a.ah,0) + COALESCE(p.ph,0) = 0 THEN 0
        ELSE 100.0 * COALESCE(a.ah,0) / (COALESCE(a.ah,0) + COALESCE(p.ph,0))
      END AS progress_pct_hours -- % progression (simple) basé heures
    FROM ORDO_PROJECT pr
    LEFT JOIN a ON a.DATASET = pr.ONB
    LEFT JOIN p ON p.DATASET = pr.ONB
    ORDER BY progress_pct_hours DESC;

- question: |
    Dans le projet 001, quelles sont les heures réelles par activité (ALLOC_NUMBER) et quelles activités consomment le plus ?
    Peut-on classer les activités du projet 001 par volume d’heures réelles agrégées ?
  sql: |
    SELECT
      wp.ALLOC_NUMBER AS activity_id,
      SUM(wp.TOTAL_LOAD) AS actual_hours
      -- , SUM(wp.TOTAL_LOAD / NULLIF(r.RATE,0)) AS actual_hours_normalized  -- si tu veux normaliser (si RATE réel existe ailleurs)
    FROM WORK_PERFORMED wp
    JOIN ORDO_PROJECT op ON op.ONB = wp.DATASET
    WHERE op.NAME = '001'
    GROUP BY wp.ALLOC_NUMBER
    ORDER BY actual_hours DESC;

- question: |
    Globalement, quelles activités portent le plus d’heures planifiées ?
    Quelles sont les activités avec les taux planifiés moyens les plus élevés ?
  sql: |
    SELECT
      ta.ONB,
      SUM(ta.TOTAL_LOAD) AS planned_hours,
      AVG(ta.RATE)       AS avg_rate
    FROM TASK_ALLOC ta
    JOIN ORDO_PROJECT op ON op.ONB = ta.DATASET
    GROUP BY ta.ONB 
    ORDER BY planned_hours DESC;

- question: |
    Pour le projet 002, quelles activités concentrent le plus d’heures planifiées ?
    Quelles sont les activités du projet 002 avec les taux moyens planifiés les plus élevés ?
  sql: |
    SELECT
      ta.ONB,
      SUM(ta.TOTAL_LOAD) AS planned_hours,
      AVG(ta.RATE)       AS avg_rate
    FROM TASK_ALLOC ta
    JOIN ORDO_PROJECT op ON op.ONB = ta.DATASET
    WHERE op.NAME = '002'
    GROUP BY ta.ONB 
